# LiteDRAM standalone core for the Arty A7's DDR3 (one MT41K128M16, 16 bits).
# Generate with:  litedram_gen fpga/arty/litedram.yml --name litedram_core
# Modelled on LiteDRAM's examples/arty.yml; Strata needs one native user
# port (128 bits wide on this board).
{
    "speedgrade":      -1,
    "cpu":             "None",
    "memtype":         "DDR3",
    "uart":            "rs232",
    "sdram_module":    "MT41K128M16",
    "sdram_module_nb": 1,
    "sdram_rank_nb":   1,
    "sdram_phy":       "A7DDRPHY",
    "rtt_nom":         "60ohm",
    "rtt_wr":          "60ohm",
    "ron":             "34ohm",
    "input_clk_freq":   100e6,
    "sys_clk_freq":     100e6,
    "iodelay_clk_freq": 200e6,
    "cmd_buffer_depth": 16,
    "user_ports": {
        "native_0": {
            "type": "native",
        },
    },
}
