# tty: the messages of os/servers/tty.s (format: os/spec/README.md)

[server]
key = "tty"
title = "tty"
role = "the console"
does = "the console server: owns console output, input, break and release; line discipline, the foreground process, Ctrl-C"
reached = "c3 of every process"
start = "proc"
pid = 6
place = { core = 4, index = 0, alone = "yes" }
core_note = "it keeps device reads waiting"
holds = "windows on the console's ports 0x0000-0x00FF (c2) and the pointer's 0x4100-0x410F (c3), from dev"
sources = ["os/servers/tty.s"]
dispatch = { file = "os/servers/tty.s", first = "^request:", last = "^\\s*li\\s+a0,\\s*-1\\s*;\\s*unknown" }
calls = "message"
note = """One console, for every process: handle 0, 1 and 2 of a program name it, and the handle \
is not looked at. The tty never blocks on the device: a read of the break port is always in flight, \
one byte of input is read only while a reader waits whose side has the console, and the pointer is \
read only once a reader has asked for its events. Ctrl-C echoes `^C`, drops a partial line and asks \
proc to SIGNAL the foreground process. Guests (ids 240..255) use the same READ and WRITE; input goes \
to one side at a time (ATTACH)."""

[[op]]
num = 1
name = "READ"
summary = "Read from the console"
note = """Cooked mode (the default): input is echoed and edited (Backspace erases), and a READ \
returns one line with its newline (at most 255 characters; more are ignored), or what was typed \
before Ctrl-D; a Ctrl-D on an empty line is the end of input (0). Raw mode: no echo, whatever bytes \
are there, at least one; a READ that does not block and finds nothing has one byte read ahead, so \
a program that polls sees the rest of an escape sequence (`vi` telling Esc from ESC [ A). CR \
becomes LF in both. A reader waits while there is nothing (up to 8 readers, answered in turn); a \
guest's READ waits while StrataOS has the console, and StrataOS's while a guest has it. \
With mode bit 1 (raw mode, the window server) the READ is also answered when pointer events wait: \
they come after the data at offset 32 and the reply's mode word says how many, so such a READ \
gives at most 32 key bytes. Without a pointer, bit 1 is ignored. A cooked READ shorter than the line \
takes its start; the rest is given only once another line is typed."""

[op.request]
handle = "0 (not checked)"
length = "the most bytes wanted (at most 4032 are given; with mode bit 1 and a pointer, 32)"
mode = "bit 0: do not block; bit 1: the pointer's events too"

[op.reply]
result = "the key bytes read; 0 at the end of input (with mode bit 1, 0 may also come with pointer events)"
mode = "the pointer events after offset 32 (0..8); 0 without mode bit 1 or without a pointer (an error leaves the request's mode)"
data = [
  { type = "bytes", name = "the bytes read", note = "with mode bit 1: at most 32, the events start at 32" },
  { repeat = "per pointer event, from offset 32 (the mode word says how many)", fields = [
    { type = "u16", name = "x", note = "framebuffer pixels" },
    { type = "u16", name = "y" },
    { type = "u8", name = "buttons", note = "bit 0 left, 1 right, 2 middle" },
    { type = "u8", name = "wheel y", note = "signed: > 0 away from the user" },
    { type = "u8", name = "wheel x", note = "signed: > 0 right" },
    { type = "u8", name = "kind", note = "1 move, 2 button, 3 wheel, 4 enter, 5 leave; a move after a move replaces it" },
  ] },
]

[op.errors]
"-2" = "interrupted while waiting (CANCEL: Ctrl-C)"
"-3" = "nothing to read, with mode bit 0"
"-7" = "8 readers are waiting already, or the kernel has no room to hold the request"

[[op]]
num = 2
name = "WRITE"
summary = "Write to the console"
note = """Output is written for anyone, guests too, whoever has the console's input. A program's \
library sends a WRITE only when its console ring cannot take the bytes (doc/strataos.md 2.3): \
before acting on any request, tty writes out every ring. An empty WRITE wakes tty when a ring \
says it sleeps."""

[op.request]
handle = "1 or 2 (not checked)"
length = "the bytes"
modes = { "0" = "write", "2" = "write, and send the sender's console ring back (its c6 is free)" }
data = [{ type = "bytes", name = "the bytes to write" }]

[op.reply]
result = "the bytes written: the length, at most 4032"
attachments = { c6 = "with mode 2, a copy of the sender's console ring (not for guests, nor if it has none)" }

[[op]]
num = 4
name = "CLOSE"
summary = "Close the console (it stays open)"
note = "From the guest the console is attached to, it gives the console back to StrataOS (Forth's `bye`): the ATTACH is answered with 1. From anyone else nothing happens."

[op.request]
handle = "the handle (not checked)"

[op.reply]
result = "0"

[[op]]
num = 18
name = "SETFG"
summary = "Make a process the foreground: Ctrl-C interrupts it"

[op.request]
handle = "the pid (not checked)"

[op.reply]
result = "0"

[[op]]
num = 19
name = "CONMODE"
summary = "Cooked or raw input"

[op.request]
handle = "bit 0: 0 cooked, 1 raw"

[op.reply]
result = "0"

[[op]]
num = 20
name = "ATTACH"
summary = "Give the console's input to a guest until it comes back"
from = "a StrataOS process (the `guest` command)"
note = """Only that guest's READs are answered meanwhile. The request waits, and is answered when \
the console comes back: Ctrl-] typed (echoed `^]`), the guest's CLOSE, the guest stopped (proc's \
CLEANUP for its id), or the attaching process interrupted or ended. The id is checked only to be \
in the guests' range, not to name a running guest."""

[op.request]
handle = "the guest id (240..255)"

[op.reply]
result = "how it came back: 0 Ctrl-] was typed, 1 the guest closed the console, 2 the guest was stopped"

[op.errors]
"-1" = "the sender is a guest, or the id is not 240..255"
"-2" = "the attaching process was interrupted (CANCEL)"
"-7" = "the console is attached to a guest already, or the kernel has no room to hold the request"
