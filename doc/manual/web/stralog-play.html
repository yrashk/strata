<!--
  The Stralog section's playground (stralog/): a panel at the side on wide
  screens, a drawer at the bottom on narrow ones. site/stralog/stralog.js
  boots StrataOS in it (the play page's worker, strata-emu.wasm and disk
  image) and types stralog at the shell's first prompt. Put after the
  page's main column by genstralog.py.
-->
<aside class="pg" id="pg" aria-label="Stralog playground">
  <div class="pg-bar">
    <button type="button" class="pg-toggle" id="pg-toggle" aria-expanded="false" aria-controls="pg-body">
      <span class="pg-title">▸ PLAYGROUND</span><span class="pg-sub">StrataOS · stralog</span>
    </button>
    <div class="pg-ctl">
      <label class="pg-demos"><span class="sr">Load an example into the editor</span>
        <select id="pg-demos"><option value="">example…</option></select></label>
      <button type="button" class="small" id="pg-reset" title="Boot a fresh machine">Reset</button>
    </div>
  </div>
  <div class="pg-body" id="pg-body">
    <div class="pg-edbar" role="group" aria-label="Editor">
      <button type="button" class="small pg-run" id="pg-run" title="Consult the editor's clauses ([user], then Ctrl-D)">Consult</button>
      <button type="button" class="small" id="pg-ask" title="Ask the selected line (or the cursor's line) as a query">Ask line</button>
      <kbd class="pg-key" id="pg-key" title="Consults the editor's text">Ctrl+Enter</kbd>
    </div>
    <div class="pg-ed" id="pg-ed">
      <pre class="pg-ed-hl hl" aria-hidden="true"><code id="pg-ed-hl"></code></pre>
      <textarea id="pg-src" rows="1" cols="1" wrap="off" spellcheck="false" autocomplete="off" autocorrect="off"
        autocapitalize="off" aria-label="Prolog clauses: edit, then Consult"></textarea>
    </div>
    <div class="pg-term"><div id="pg-term"></div></div>
    <p class="pg-jitnote" id="pg-jitnote" hidden><span id="pg-jitnote-t"></span>
      <button type="button" class="small" id="pg-jit-on">Turn the JIT on</button></p>
    <p class="pg-status" id="pg-status" aria-live="polite">idle</p>
  </div>
</aside>
