<!--
  The Stratalk section's playground (stratalk/): a panel at the side on wide
  screens, a drawer at the bottom on narrow ones. site/stratalk/stratalk.js
  boots StrataOS (build/disk.img) in it with site/play/worker.js and the play
  page's strata-emu.wasm, and starts the REPL. Put after the page's main
  column by genstratalk.py.
-->
<aside class="pg" id="pg" aria-label="Stratalk playground">
  <div class="pg-bar">
    <button type="button" class="pg-toggle" id="pg-toggle" aria-expanded="false" aria-controls="pg-body">
      <span class="pg-title">▸ PLAYGROUND</span><span class="pg-sub">StrataOS · stratalk -j · 8 cores</span>
    </button>
    <div class="pg-ctl">
      <label class="pg-demos"><span class="sr">Run an example</span>
        <select id="pg-demos"><option value="">example…</option></select></label>
      <button type="button" class="small" id="pg-reset" title="Boot a fresh machine">Reset</button>
    </div>
  </div>
  <div class="pg-body" id="pg-body">
    <div class="pg-edbar" role="group" aria-label="Editor">
      <button type="button" class="small pg-run" id="pg-run" title="File the editor's text in (definitions and statements)">Run</button>
      <button type="button" class="small" id="pg-runsel" title="Evaluate the selected line (or the cursor's line) and print it">Print line</button>
      <button type="button" class="small" id="pg-rerun" title="Boot a fresh machine, then run the editor's text">Reset + Run</button>
      <kbd class="pg-key" id="pg-key" title="Runs the editor's text">Ctrl+Enter</kbd>
    </div>
    <div class="pg-ed" id="pg-ed">
      <pre class="pg-ed-hl hl" aria-hidden="true"><code id="pg-ed-hl"></code></pre>
      <textarea id="pg-src" rows="1" cols="1" wrap="off" spellcheck="false" autocomplete="off" autocorrect="off"
        autocapitalize="off" aria-label="Stratalk source: edit, then Run"></textarea>
    </div>
    <div class="pg-term"><div id="pg-term"></div></div>
    <p class="pg-jitnote" id="pg-jitnote" hidden><span id="pg-jitnote-t"></span>
      <button type="button" class="small" id="pg-jit-on">Turn the JIT on</button></p>
    <p class="pg-status" id="pg-status" aria-live="polite">idle</p>
  </div>
</aside>
